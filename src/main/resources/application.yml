spring:
  lifecycle:
    # Teto para o encerramento gracioso. Menor que o `-t 30` do `docker stop`, senao o Docker mata
    # antes de a aplicacao terminar e o graceful nao serve para nada.
    timeout-per-shutdown-phase: 25s
  task:
    scheduling:
      pool:
        # O poller de marketplace nao pode disputar a unica thread padrao do agendador.
        #
        # ITEM 9.1 DA VARREDURA: eram 5 rotinas agendadas em 4 threads, e a quinta ficava na fila. A
        # que podia ficar e a pior de ficar: o MarketplacePoller, sem o qual o restaurante some do
        # iFood. Agora sao 6 rotinas (entrou a reconciliacao do valor da mensalidade, item 3.8) e 8
        # threads -- as duas de sobra sao para a proxima, porque thread parada nao custa nada e
        # rotina na fila custa a loja fora do aplicativo.
        size: 8
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
      # Acima deste limiar o Tomcat grava o upload em disco. Mantendo o limiar ACIMA do tamanho
      # maximo do arquivo, foto de documento de lojista nunca encosta no disco do servidor: entra
      # na memoria, e repassada ao Asaas e morre com a requisicao.
      file-size-threshold: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bora}
    username: ${SPRING_DATASOURCE_USERNAME:bora}
    password: ${SPRING_DATASOURCE_PASSWORD:bora123}
    hikari:
      # O padrao do Hikari sao 10 conexoes, e isso nunca foi escrito em lugar nenhum -- entao ninguem
      # sabia que o teto existia. Com chamada externa dentro da transacao do pedido, 10 pessoas
      # pagando PIX ao mesmo tempo travavam o painel de TODAS as lojas. O Postgres gerenciado aceita
      # 81 conexoes e usa ~19 hoje; 20 aqui deixa folga para backup, uma segunda instancia e o resto.
      maximum-pool-size: ${BORA_DB_POOL:20}
      # Esperar 30s (padrao) por uma conexao vira fila que nao anda. Melhor falhar em 10 e liberar a
      # thread do que empilhar requisicao que o cliente ja desistiu de esperar.
      connection-timeout: 10000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
bora:
  seguranca:
    # Cifra em repouso as credenciais de TERCEIROS no banco (chave do Asaas do lojista, client secret e
    # tokens de marketplace). Ver config/SegredoGuardado.java.
    #
    # SEM VALOR PADRAO de proposito: vazio mantem tudo em texto puro, exatamente como antes, com aviso
    # no log. Assim este codigo sobe sem coordenar com a configuracao do servidor.
    #
    # Gerar: openssl rand -base64 48
    # PERDER A CHAVE E PERDER AS CREDENCIAIS: guardar junto do api.env no gerenciador de senhas.
    segredo-colunas: ${BORA_SEGREDO_COLUNAS:}
  suporte:
    # Para onde vai o aviso de "esqueci minha senha", alem do administrador da propria loja. E o
    # mesmo numero que a tela de login ja mostra como suporte. Vazio desliga esse segundo destino.
    #
    # AVISO: o envio depende da Cloud API da Meta, e em 18/10/2026 NENHUMA loja tinha credencial
    # valida (a da loja 1 venceu em 08/07, a da loja 18 tem 9 caracteres). Enquanto isso, o aviso
    # que funciona e o que aparece na tela de Usuarios do administrador.
    whatsapp: ${BORA_SUPORTE_WHATSAPP:5515998602332}

server:
  port: ${PORT:8080}
  # Deploy e `docker stop -t 30 api` seguido de `run`. Sem isto o Tomcat morria no ato e cortava a
  # requisicao em andamento no meio: o lojista que estava apertando "Aceitar" levava erro, e o cliente
  # no meio de um checkout com PIX podia ter o pedido criado sem a cobranca. Com graceful, as chamadas
  # em voo terminam antes de a JVM sair, dentro do teto abaixo.
  shutdown: graceful
  error:
    include-message: always
springdoc:
  # Fechada por padrão: na internet, a documentação entregava o mapa das 138 rotas — inclusive as de
  # administrador da plataforma — para qualquer um. Para abrir no desenvolvimento, exporte
  # SPRINGDOC_API_DOCS_ENABLED=true e SPRINGDOC_SWAGGER_UI_ENABLED=true.
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

asaas:
  base-url: ${ASAAS_BASE_URL:https://sandbox.asaas.com/api/v3}
  api-key: ${ASAAS_API_KEY:}
  webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
  # Recebimento white-label (subconta + split): o PIX do cliente cai na conta do lojista.
  url-publica: ${ASAAS_URL_PUBLICA:https://borahapp.com.br}
  platform-wallet-id: ${ASAAS_PLATFORM_WALLET_ID:}
  taxa-percentual: ${ASAAS_TAXA_PERCENTUAL:0}

# Integracao oficial com marketplaces. O aplicativo e da PLATAFORMA (integradora);
# por loja guardamos so o merchantId e os tokens que o lojista autorizou.
marketplace:
  ifood:
    base-url: ${BORA_IFOOD_BASE_URL:https://merchant-api.ifood.com.br}
    client-id: ${BORA_IFOOD_CLIENT_ID:}
    client-secret: ${BORA_IFOOD_CLIENT_SECRET:}
  opendelivery:
    base-url: ${BORA_OPENDELIVERY_BASE_URL:https://openapi.99food.com/v4/opendelivery}
    client-id: ${BORA_OPENDELIVERY_CLIENT_ID:}
    client-secret: ${BORA_OPENDELIVERY_CLIENT_SECRET:}
  polling:
    # A loja so fica online no iFood enquanto este ciclo roda. Nao aumentar sem motivo.
    intervalo-ms: ${BORA_MARKETPLACE_POLLING_MS:30000}
    habilitado: ${BORA_MARKETPLACE_POLLING:true}
